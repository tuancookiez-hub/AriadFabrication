# Ariad PrusaSlicer 2.9.6 Golden Part composite analysis profile.
# Generated G-code is disconnected and must not be dispatched to hardware.

printer_technology = FFF
bed_shape = 0x0,220x0,220x220,0x220
max_print_height = 250
nozzle_diameter = 0.4
filament_diameter = 1.75
gcode_flavor = marlin2
binary_gcode = 0
arc_fitting = disabled
autoemit_temperature_commands = 1
start_gcode = G28 ; home all axes\nG1 Z5 F5000 ; lift nozzle\n
end_gcode = M104 S0 ; turn off nozzle\nM140 S0 ; turn off bed\nM107 ; turn off fan\nM84 ; disable motors\n
use_relative_e_distances = 0
retract_length = 0.8
retract_speed = 35
travel_speed = 150
output_filename_format = [input_filename_base].gcode

filament_type = PETG
filament_density = 1.27
filament_cost = 20
filament_max_volumetric_speed = 8
temperature = 240
first_layer_temperature = 240
bed_temperature = 90
first_layer_bed_temperature = 85
cooling = 1
fan_always_on = 1
disable_fan_first_layers = 3
min_fan_speed = 30
max_fan_speed = 50
bridge_fan_speed = 50

layer_height = 0.2
first_layer_height = 0.2
perimeters = 3
top_solid_layers = 4
bottom_solid_layers = 4
fill_density = 30%
fill_pattern = gyroid
support_material = 0
skirts = 1
skirt_distance = 6
brim_width = 0
perimeter_speed = 45
external_perimeter_speed = 30
small_perimeter_speed = 25
infill_speed = 50
solid_infill_speed = 40
top_solid_infill_speed = 30
bridge_speed = 25
first_layer_speed = 20
